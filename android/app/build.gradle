plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kimtaeyoun.timetablekids'
    compileSdk 34

    defaultConfig {
        applicationId "com.kimtaeyoun.timetablekids"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 웹앱(index.html·manifest.json·sw.js)은 저장소 최상단이 원본이다.
// gradle 로 빌드할 때도 assets/www 로 복사해서 같은 파일을 담는다.
tasks.register('copyWebAssets', Copy) {
    from rootProject.projectDir.getParentFile()
    include 'index.html', 'manifest.json', 'sw.js'
    into layout.projectDirectory.dir('src/main/assets/www')
}

preBuild.dependsOn copyWebAssets
